</main>
</div>
<script>
(function(){
  "use strict";
  var $=function(s,r){return (r||document).querySelector(s)}, $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
  function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

  /* ---------- Theme ---------- */
  var root=document.documentElement, saved=store("evk-theme");
  if(saved==="light"||saved==="dark")root.setAttribute("data-theme",saved);
  $("#theme").addEventListener("click",function(){
    var cur=root.getAttribute("data-theme");
    if(!cur)cur=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
    var nxt=cur==="dark"?"light":"dark"; root.setAttribute("data-theme",nxt); store("evk-theme",nxt);
  });

  /* ---------- Navigation (bygges fra <section data-nav="Gruppe|Tittel"> ) ---------- */
  var secs=$$("main>section[id]"), groups=[], gmap={};
  secs.forEach(function(s){
    var d=(s.getAttribute("data-nav")||"Annet|"+(s.getAttribute("data-title")||s.id)).split("|");
    var g=d[0], t=d[1]||s.id;
    if(!gmap[g]){gmap[g]=[];groups.push(g)}
    gmap[g].push({id:s.id,title:t,status:s.getAttribute("data-status")||""});
  });
  var nav=$("#nav"), html="";
  groups.forEach(function(g){
    html+="<h6>"+g+"</h6>";
    gmap[g].forEach(function(it){
      html+='<a href="#'+it.id+'" data-t="'+it.id+'">'+it.title+(it.status?'<span class="st">'+it.status+'</span>':"")+"</a>";
    });
  });
  nav.innerHTML=html;
  var links=$$("a[data-t]",nav);
  if("IntersectionObserver" in window){
    var io=new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting){ links.forEach(function(l){l.classList.toggle("active",l.getAttribute("data-t")===e.target.id)}) } });
    },{rootMargin:"-20% 0px -70% 0px"});
    secs.forEach(function(s){io.observe(s)});
  }
  $("#menuBtn").addEventListener("click",function(){document.body.classList.toggle("navopen")});
  nav.addEventListener("click",function(e){ if(e.target.closest("a"))document.body.classList.remove("navopen") });

  /* ---------- Sammenleggbare makroseksjoner (starter skjult — siden skal være skumlesbar) ---------- */
  var macros=$$("section.macro"), allOpen=false;
  macros.forEach(function(m){
    var h=$("h2",m); if(!h)return;
    var b=document.createElement("button"); b.className="btn collapser"; b.type="button"; b.title="Skjul/vis detaljer";
    b.addEventListener("click",function(){ var c=m.classList.toggle("collapsed"); b.textContent=c?"Vis detaljer":"Skjul"; });
    h.appendChild(b);
    var st=m.getAttribute("data-status"); if(st){var sp=document.createElement("span"); sp.className="status"+(/utvikling|planlagt/i.test(st)?" dev":""); sp.textContent=st; h.insertBefore(sp,b);}
    m.classList.add("collapsed"); b.textContent="Vis detaljer";
  });
  $("#expand").addEventListener("click",function(){
    allOpen=!allOpen;
    macros.forEach(function(m){ m.classList.toggle("collapsed",!allOpen); var b=$(".collapser",m); if(b)b.textContent=allOpen?"Skjul":"Vis detaljer"; });
    this.textContent=allOpen?"Skjul alle":"Utvid alle";
  });
  $("#expand").textContent="Utvid alle";

  /* ---------- Filter på fallgruve-kategori ---------- */
  var cats={};
  $$(".gotcha[data-cat]").forEach(function(g){cats[g.getAttribute("data-cat")]=(cats[g.getAttribute("data-cat")]||0)+1});
  var tb=$("#gotcha-toolbar");
  if(tb){
    var act=null;
    var mk=function(label,key){
      var b=document.createElement("button"); b.type="button"; b.className="fc"; b.setAttribute("aria-pressed",key===null?"true":"false"); b.textContent=label; b.setAttribute("data-k",key===null?"":key);
      b.addEventListener("click",function(){
        act=key; $$(".fc",tb).forEach(function(x){x.setAttribute("aria-pressed",x===b?"true":"false")}); applyCatFilter();
      });
      tb.appendChild(b);
    };
    mk("Alle ("+$$(".gotcha").length+")",null);
    Object.keys(cats).sort().forEach(function(k){mk(k+" ("+cats[k]+")",k)});
    var applyCatFilter=function(){ $$(".gotcha").forEach(function(g){ g.classList.toggle("hide",act!==null&&g.getAttribute("data-cat")!==act) }) };
  }

  /* ---------- Søk med uthevelse ---------- */
  var q=$("#q"), cnt=$("#cnt"), hits=[], cur=-1, timer=null;
  function clearMarks(){
    $$("mark.hit").forEach(function(m){var p=m.parentNode; p.replaceChild(document.createTextNode(m.textContent),m); p.normalize()});
    hits=[];cur=-1;cnt.textContent="";
  }
  function doSearch(){
    clearMarks();
    var term=q.value.trim(); if(term.length<2)return;
    var re=new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi");
    var walker=document.createTreeWalker($("#content"),NodeFilter.SHOW_TEXT,{acceptNode:function(n){
      if(!n.nodeValue||!re.test(n.nodeValue)){re.lastIndex=0;return NodeFilter.FILTER_REJECT} re.lastIndex=0;
      var p=n.parentNode; if(!p||/^(SCRIPT|STYLE|BUTTON)$/.test(p.nodeName))return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;}});
    var nodes=[],n; while((n=walker.nextNode()))nodes.push(n);
    nodes.forEach(function(node){
      var txt=node.nodeValue, frag=document.createDocumentFragment(), last=0, m; re.lastIndex=0;
      while((m=re.exec(txt))){
        if(m.index>last)frag.appendChild(document.createTextNode(txt.slice(last,m.index)));
        var mk=document.createElement("mark"); mk.className="hit"; mk.textContent=m[0]; frag.appendChild(mk); last=m.index+m[0].length;
        if(m[0].length===0)re.lastIndex++;
      }
      if(last<txt.length)frag.appendChild(document.createTextNode(txt.slice(last)));
      node.parentNode.replaceChild(frag,node);
    });
    hits=$$("mark.hit");
    // Åpne sammenleggede seksjoner/skjulte kort som har treff
    hits.forEach(function(h){ var m=h.closest(".macro.collapsed"); if(m){m.classList.remove("collapsed"); var b=$(".collapser",m); if(b)b.textContent="Skjul"} var g=h.closest(".gotcha.hide"); if(g)g.classList.remove("hide"); var d=h.closest("details"); if(d)d.open=true; });
    cnt.textContent=hits.length?("1 / "+hits.length):"ingen treff";
    if(hits.length)go(0);
  }
  function go(i){
    if(!hits.length)return; if(cur>=0&&hits[cur])hits[cur].classList.remove("cur");
    cur=(i+hits.length)%hits.length; var h=hits[cur]; h.classList.add("cur");
    h.scrollIntoView({block:"center",behavior:"smooth"}); cnt.textContent=(cur+1)+" / "+hits.length;
  }
  q.addEventListener("input",function(){clearTimeout(timer);timer=setTimeout(doSearch,220)});
  q.addEventListener("keydown",function(e){ if(e.key==="Enter"){e.preventDefault();go(cur+(e.shiftKey?-1:1))} else if(e.key==="Escape"){q.value="";clearMarks()} });
  $("#next").addEventListener("click",function(){go(cur+1)}); $("#prev").addEventListener("click",function(){go(cur-1)});
  document.addEventListener("keydown",function(e){ if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();q.focus();q.select()} });

  /* ---------- Kopier-knapper for startprompter ---------- */
  $$("[data-copy]").forEach(function(b){
    b.addEventListener("click",function(){
      var t=document.getElementById(b.getAttribute("data-copy")); if(!t)return;
      var txt=t.innerText;
      var done=function(){var o=b.textContent;b.textContent="Kopiert ✓";setTimeout(function(){b.textContent=o},1500)};
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,function(){fb(txt,done)})}else fb(txt,done);
    });
  });
  function fb(txt,done){var ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done()}catch(e){}document.body.removeChild(ta)}

  /* ---------- Ethvert internt lenkeklikk (nav, kort, kryssreferanser) utvider et skjult mål automatisk ---------- */
  function expandTarget(id){
    var t=document.getElementById(id); if(!t)return;
    var m=t.closest(".macro.collapsed"); if(m){m.classList.remove("collapsed"); var b=$(".collapser",m); if(b)b.textContent="Skjul";}
    var d=t.closest("details"); while(d){d.open=true; d=d.parentElement?d.parentElement.closest("details"):null;}
  }
  document.addEventListener("click",function(e){
    var a=e.target.closest('a[href^="#"]'); if(!a)return;
    var id=a.getAttribute("href").slice(1); if(id)expandTarget(id);
  });

  // Hopp til hash etter at nav er bygget
  if(location.hash){var hid=location.hash.slice(1); expandTarget(hid); var t=document.getElementById(hid); if(t)setTimeout(function(){t.scrollIntoView()},50)}
})();
</script>
</body>
</html>
